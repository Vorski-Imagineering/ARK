<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"
     fill="none" stroke="#0c0c0c"
     stroke-linecap="round" stroke-linejoin="round"
     font-family="'Fraunces', 'Times New Roman', serif"
     role="img" aria-label="The Almanac — a two-week and two-day schedule rendered as a Codex Atlanticus astronomical dial">

  <title>Plate III — The Almanac</title>
  <desc>An ink-line drawing in the style of Leonardo da Vinci's Codex folios: an astronomical dial with fourteen day-ticks for two weeks of preparation, a sun and two crescent moons marking milestone sessions, and two bold ticks marking the two build days, converging on a central hourglass, inside a sixteen-toothed cogwheel.</desc>

  <!-- Paper -->
  <rect width="800" height="800" fill="#f6f4ee" stroke="none"/>

  <defs>
    <pattern id="hatchA" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0c0c0c" stroke-width="0.45" opacity="0.9"/>
    </pattern>
    <pattern id="hatchB" patternUnits="userSpaceOnUse" width="3.6" height="3.6" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="3.6" stroke="#0c0c0c" stroke-width="0.45"/>
    </pattern>
    <pattern id="hatchC" patternUnits="userSpaceOnUse" width="2.6" height="2.6" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="2.6" stroke="#0c0c0c" stroke-width="0.55"/>
      <line x1="0" y1="0" x2="2.6" y2="0" stroke="#0c0c0c" stroke-width="0.35" opacity="0.55"/>
    </pattern>
    <clipPath id="almanac-inside">
      <circle cx="400" cy="400" r="244"/>
    </clipPath>
  </defs>

  <!-- Construction guides -->
  <g stroke="#0c0c0c" stroke-width="0.35" opacity="0.16">
    <rect x="56" y="56" width="688" height="688"/>
    <rect x="56" y="56" width="688" height="425.2"/>
    <rect x="56" y="318.8" width="688" height="425.2"/>
    <line x1="56"  y1="400" x2="744" y2="400"/>
    <line x1="400" y1="56"  x2="400" y2="744"/>
    <line x1="56"  y1="56"  x2="744" y2="744"/>
    <line x1="744" y1="56"  x2="56"  y2="744"/>
    <circle cx="400" cy="400" r="354"/>
    <circle cx="400" cy="400" r="200"/>
    <circle cx="400" cy="400" r="100"/>
    <circle cx="400" cy="400" r="62"/>
    <line x1="400" y1="400" x2="400" y2="46"  stroke-dasharray="2 4"/>
    <line x1="400" y1="400" x2="754" y2="400" stroke-dasharray="2 4"/>
    <line x1="400" y1="400" x2="400" y2="754" stroke-dasharray="2 4"/>
    <line x1="400" y1="400" x2="46"  y2="400" stroke-dasharray="2 4"/>
  </g>

  <!-- Compass cardinals -->
  <g fill="#0c0c0c" font-style="italic" opacity="0.55" font-size="11" stroke="none" text-anchor="middle">
    <text x="400" y="50">N</text>
    <text x="400" y="762">S</text>
    <text x="46"  y="404">W</text>
    <text x="754" y="404">E</text>
  </g>

  <!-- 36 ticks every 10 degrees -->
  <g stroke="#0c0c0c" stroke-width="0.5" opacity="0.7">
    <line x1="400" y1="42"  x2="400" y2="56"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(10 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(20 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(30 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(40 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(50 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(60 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(70 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(80 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(90 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(100 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(110 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(120 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(130 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(140 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(150 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(160 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(170 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(180 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(190 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(200 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(210 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(220 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(230 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(240 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(250 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(260 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(270 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(280 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(290 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(300 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(310 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(320 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(330 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(340 400 400)"/>
    <line x1="400" y1="42"  x2="400" y2="56" transform="rotate(350 400 400)"/>
  </g>

  <!-- Cyberpunk corner modules -->
  <g stroke="#0c0c0c" stroke-width="0.55" opacity="0.78">
    <rect x="56" y="100" width="46" height="60"/>
    <line x1="56"  y1="118" x2="46"  y2="118"/>
    <line x1="56"  y1="142" x2="46"  y2="142"/>
    <line x1="102" y1="120" x2="120" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="160"/>
    <circle cx="120" cy="160" r="2.2" fill="#0c0c0c"/>
    <circle cx="79" cy="130" r="2.6" fill="#f6f4ee"/>
    <circle cx="79" cy="130" r="0.9" fill="#0c0c0c"/>
    <line x1="65" y1="148" x2="93" y2="148"/>

    <rect x="698" y="640" width="46" height="60"/>
    <line x1="698" y1="658" x2="688" y2="658"/>
    <line x1="744" y1="680" x2="760" y2="680"/>
    <line x1="688" y1="658" x2="688" y2="700"/>
    <circle cx="688" cy="700" r="2.2" fill="#0c0c0c"/>
    <circle cx="721" cy="670" r="2.6" fill="#f6f4ee"/>
    <circle cx="721" cy="670" r="0.9" fill="#0c0c0c"/>
    <line x1="707" y1="688" x2="735" y2="688"/>

    <path d="M 56 80 L 56 56 L 80 56"/>
    <path d="M 720 56 L 744 56 L 744 80"/>
    <path d="M 56 720 L 56 744 L 80 744"/>
    <path d="M 720 744 L 744 744 L 744 720"/>
  </g>

  <!-- Outer rim -->
  <g stroke="#0c0c0c">
    <circle cx="400" cy="400" r="300" stroke-width="1.6"/>
    <circle cx="400" cy="400" r="296" stroke-width="0.4" opacity="0.55"/>
  </g>

  <!-- Gear teeth -->
  <g stroke="#0c0c0c" stroke-width="1.4" fill="#f6f4ee">
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(0) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(22.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(45) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(67.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(90) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(112.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(135) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(157.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(180) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(202.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(225) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(247.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(270) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(292.5) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(315) translate(0 -315)"/>
    <rect x="-22" y="-15" width="44" height="30" rx="2" transform="translate(400 400) rotate(337.5) translate(0 -315)"/>
  </g>

  <!-- Bolt holes -->
  <g stroke="#0c0c0c" stroke-width="0.7" fill="#f6f4ee">
    <circle cx="400" cy="130" r="3.5"/>
    <circle cx="591" cy="209" r="3.5"/>
    <circle cx="670" cy="400" r="3.5"/>
    <circle cx="591" cy="591" r="3.5"/>
    <circle cx="400" cy="670" r="3.5"/>
    <circle cx="209" cy="591" r="3.5"/>
    <circle cx="130" cy="400" r="3.5"/>
    <circle cx="209" cy="209" r="3.5"/>
  </g>

  <!-- Inner rim -->
  <g stroke="#0c0c0c">
    <circle cx="400" cy="400" r="245" stroke-width="1.4"/>
    <circle cx="400" cy="400" r="241" stroke-width="0.4" opacity="0.55"/>
    <circle cx="400" cy="400" r="237" stroke-width="0.3" opacity="0.4" stroke-dasharray="1.4 1.4"/>
  </g>

  <!-- Inside the gear -->
  <g clip-path="url(#almanac-inside)">

    <!-- Almanac dial rings -->
    <g stroke="#0c0c0c" stroke-width="0.6" opacity="0.7">
      <circle cx="400" cy="400" r="220"/>
      <circle cx="400" cy="400" r="185"/>
      <circle cx="400" cy="400" r="120"/>
    </g>

    <!-- fourteen day ticks: two weeks of preparation -->
    <g stroke="#0c0c0c" stroke-width="0.8">
      <line x1="250.6" y1="274.7" x2="239.1" y2="265.0"/>
      <line x1="307.1" y1="228.6" x2="299.9" y2="215.4"/>
      <line x1="376.5" y1="206.4" x2="374.7" y2="191.5"/>
      <line x1="449.2" y1="211.3" x2="453.0" y2="196.8"/>
      <line x1="515.0" y1="242.6" x2="523.9" y2="230.4"/>
      <line x1="564.8" y1="295.8" x2="577.5" y2="287.8"/>
      <line x1="591.6" y1="363.6" x2="606.3" y2="360.8"/>
      <line x1="591.6" y1="436.4" x2="606.3" y2="439.2"/>
      <line x1="564.8" y1="504.2" x2="577.5" y2="512.2"/>
      <line x1="515.0" y1="557.4" x2="523.9" y2="569.6"/>
      <line x1="449.2" y1="588.7" x2="453.0" y2="603.2"/>
      <line x1="376.5" y1="593.6" x2="374.7" y2="608.5"/>
      <line x1="307.1" y1="571.4" x2="299.9" y2="584.6"/>
      <line x1="250.6" y1="525.3" x2="239.1" y2="535.0"/>
    </g>

    <!-- two bold ticks: the build days -->
    <g stroke="#0c0c0c" stroke-width="2">
      <line x1="235.5" y1="495.0" x2="213.8" y2="507.5"/>
      <line x1="212.9" y1="433.0" x2="188.3" y2="437.3"/>
    </g>

    <!-- sun disc (orientation session) -->
    <g stroke="#0c0c0c" stroke-width="0.8">
      <circle cx="400" cy="230" r="20"/>
      <line x1="400" y1="198" x2="400" y2="188"/>
      <line x1="428" y1="212" x2="435" y2="206"/>
      <line x1="372" y1="212" x2="365" y2="206"/>
      <line x1="428" y1="248" x2="435" y2="254"/>
      <line x1="372" y1="248" x2="365" y2="254"/>
    </g>

    <!-- crescent moon (source review / design lock) -->
    <g stroke="#0c0c0c" stroke-width="0.8">
      <path d="M 560 300 A 22 22 0 1 0 560 344 A 17 17 0 1 1 560 300 Z"/>
    </g>
    <g stroke="#0c0c0c" stroke-width="0.8">
      <path d="M 240 300 A 22 22 0 1 1 240 344 A 17 17 0 1 0 240 300 Z"/>
    </g>

    <!-- central hourglass / countdown to the build -->
    <g stroke="#0c0c0c" stroke-width="1">
      <path d="M 372 370 L 428 370 L 400 400 L 428 430 L 372 430 L 400 400 Z"/>
      <line x1="372" y1="370" x2="428" y2="370"/>
      <line x1="372" y1="430" x2="428" y2="430"/>
    </g>
    <g stroke="#0c0c0c" stroke-width="0.35" opacity="0.5" fill="url(%23hatchC)">
      <path d="M 400 400 L 380 378 L 420 378 Z"/>
    </g>

    <!-- radiating transmission marks below, toward the build days -->
    <g stroke="#0c0c0c" stroke-width="0.4" opacity="0.5">
      <circle cx="400" cy="400" r="60"/>
      <circle cx="400" cy="400" r="80"/>
    </g>

  </g>

  <!-- Center focal mark -->
  <g stroke="#0c0c0c" stroke-width="0.5" opacity="0.6">
    <circle cx="400" cy="400" r="3.5" fill="#f6f4ee"/>
    <line x1="394" y1="400" x2="406" y2="400"/>
    <line x1="400" y1="394" x2="400" y2="406"/>
  </g>


  <g fill="#0c0c0c" stroke="none">
    <text x="400" y="672" text-anchor="middle"
          font-family="'Fraunces', 'Times New Roman', serif"
          font-size="30" font-weight="500" letter-spacing="6"
          font-variation-settings="'opsz' 60, 'wght' 380">THE ALMANAC</text>
  </g>


  <!-- Margin annotations -->
  <g fill="#0c0c0c" stroke="none">
    <text x="60" y="74" font-family="'Fraunces', serif" font-style="italic" font-size="14" opacity="0.78"
          font-variation-settings="'opsz' 24, 'wght' 360">dies · praeparatio</text>
    <text x="60" y="92" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="2" opacity="0.55">FOL. III · R°</text>

    <text x="740" y="80" text-anchor="end" font-family="'Fraunces', serif" font-style="italic" font-size="28" opacity="0.85"
          font-variation-settings="'opsz' 60, 'wght' 320">III</text>

    <text x="60" y="730" font-family="'Fraunces', serif" font-style="italic" font-size="11" opacity="0.65"
          font-variation-settings="'opsz' 24, 'wght' 360">two weeks prepared</text>

    <text x="740" y="730" text-anchor="end" font-family="'Fraunces', serif" font-style="italic" font-size="11" opacity="0.65"
          font-variation-settings="'opsz' 24, 'wght' 360">two days built</text>

    <text x="40" y="556" transform="rotate(-90 40 556)"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="9" letter-spacing="3.2" opacity="0.55">PLATE · III — TWO WEEKS OF PREPARATION, THEN TWO DAYS OF BUILD</text>

    <text x="760" y="556" transform="rotate(90 760 556)"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="9" letter-spacing="3.2" opacity="0.55">LAB Nº1 · AUDAX LAB HACKATHON · AUG 18–19 · CC0</text>

    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.5" opacity="0.65">
      <text x="400" y="182" text-anchor="middle">orientation</text>
      <text x="590" y="325" text-anchor="start">design lock</text>
      <text x="210" y="325" text-anchor="end">readiness</text>
      <text x="400" y="450" text-anchor="middle">18–19 AUG</text>
    </g>
  </g>

  <g fill="#0c0c0c" stroke="none" opacity="0.45">
    <text x="510" y="120" font-family="'Fraunces', serif" font-style="italic" font-size="11"
          font-variation-settings="'opsz' 24, 'wght' 350"
          transform="scale(-1 1) translate(-1020 0)">tempus breve · opus firmum</text>
  </g>

</svg>
