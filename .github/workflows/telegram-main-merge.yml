name: Notify Telegram on main updates

# Fires on every push to main (merges and direct pushes).
# Posts a short notice into the DEV channel.

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: actions

    steps:
      - name: Send Telegram message
        run: |
          MESSAGE="📌 New update on main in ${{ github.repository }}

          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}
          Author: ${{ github.event.head_commit.author.name }}
          SHA: ${GITHUB_SHA::7}
          Compare: ${{ github.event.compare }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_DEV_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"
