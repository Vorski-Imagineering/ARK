name: Notify Telegram on deploy tag

# Fires when a deploy-* tag is pushed.
# Posts a short notice into the DEV channel — useful if you ever want to gate
# manual deploys behind tags rather than relying on push-to-main.

on:
  push:
    tags:
      - 'deploy-*'

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: actions

    steps:
      - name: Send Telegram message
        run: |
          MESSAGE="🏷️ Deploy tag created in ${{ github.repository }}

          Tag: ${{ github.ref_name }}
          Author: ${{ github.event.pusher.name }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_DEV_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"
