name: Deploy — audax.red/ARK

# Fires on every push to main. Runs scripts/deploy.sh from CI to push the
# public/ directory to the audax.red web host via SCP.
#
# Notifications:
#   - DEV channel    → deploy started, deploy failed (with the failing step)
#   - PUBLIC channel → deploy succeeded (the site is live)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN     — BotFather token (form: 1234:AB...)
#   TELEGRAM_DEV_CHAT_ID   — internal/dev channel chat id
#   TELEGRAM_PUBLIC_CHAT_ID — public-facing channel chat id
#   DEPLOY_SSH_KEY         — private key whose public counterpart is in
#                            vorski@162.215.121.122:~/.ssh/authorized_keys

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy public/ to audax.red
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Notify Telegram (DEV) — deploy started
        run: |
          MESSAGE="🔨 ARK site deploy started

          Commit: ${{ github.event.head_commit.message }}
          Author: ${{ github.event.head_commit.author.name }}
          SHA: ${GITHUB_SHA::7}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_DEV_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"

      - name: Set up SSH
        id: ssh
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 162.215.121.122 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy.sh
        id: deploy_run
        run: ./scripts/deploy.sh

      - name: Notify Telegram (PUBLIC) — site live
        if: success()
        run: |
          MESSAGE="🌐 ARK site updated → https://audax.red/ARK/

          Commit: ${{ github.event.head_commit.message }}
          SHA: ${GITHUB_SHA::7}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"

      - name: Notify Telegram (DEV) — deploy succeeded
        if: success()
        run: |
          MESSAGE="✅ ARK site deployed successfully

          SHA: ${GITHUB_SHA::7}
          URL: https://audax.red/ARK/"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_DEV_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"

      - name: Notify Telegram (DEV) — deploy failed
        if: failure()
        run: |
          FAILED_STEP="unknown step"
          if [[ "${{ steps.ssh.outcome }}"        == "failure" ]]; then FAILED_STEP="SSH setup"; fi
          if [[ "${{ steps.deploy_run.outcome }}" == "failure" ]]; then FAILED_STEP="deploy.sh (scp)"; fi
          MESSAGE="❌ ARK deploy FAILED at: ${FAILED_STEP}

          Commit: ${{ github.event.head_commit.message }}
          Author: ${{ github.event.head_commit.author.name }}
          SHA: ${GITHUB_SHA::7}
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_DEV_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"
