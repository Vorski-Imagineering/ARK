name: Notify Telegram on issues

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: actions

    steps:
      - name: Send Telegram message
        run: |
          ACTION="${{ github.event.action }}"
          if [ "$ACTION" = "opened" ]; then ICON="🆕"; elif [ "$ACTION" = "closed" ]; then ICON="✅"; else ICON="🔄"; fi

          MESSAGE="${ICON} Issue ${ACTION} in ${{ github.repository }}

          #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
          By: ${{ github.event.issue.user.login }}
          URL: ${{ github.event.issue.html_url }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_DEV_CHAT_ID }}" \
            --data-urlencode text="$MESSAGE"
